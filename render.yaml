# Render Blueprint: один Node-сервис раздаёт сайт и /api/chat.
services:
  - type: web
    name: daniela-lawyer
    runtime: node
    plan: free               # бесплатно, без карты; засыпает через 15 мин простоя (первый запрос после сна ~50 с). Для 24/7 — plan: starter
    region: frankfurt        # ближе к Испании
    buildCommand: echo "no build step"
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true         # деплой при каждом push в main
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      # ALLOWED_ORIGINS здесь не задаём: нужна только если сайт открывается с ДРУГОГО домена,
      # тогда добавьте её вручную в Render → Environment (например https://example.github.io)
      - key: ANTHROPIC_API_KEY
        sync: false            # значение вводится в панели Render
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_INVITE_CODE   # одноразовое приглашение владельца; после назначения удалить
        sync: false
